services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trackteam
      POSTGRES_PASSWORD: trackteam
      POSTGRES_DB: trackteam
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackteam"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
